purpose:
  stands_in_for: Gemini generateContent structured output, using synthetic responses only.
  unblocks: Local HTTP contract, timeout and failure tests of the three Module 1 adapters without secrets, remote data or billing.
assumptions:
  - id: official-structured-contract
    status: supported
    claim: Gemini REST documents generationConfig.responseFormat.text with APPLICATION_JSON and JSON Schema.
    reason: The mock models the official REST contract subset used by the adapters; it does not reproduce language model generation.
    verification: Official REST reference and Gemini 3.5 Flash-Lite docs read on 2026-11-03; adapters exercised against this subset.
    source: https://ai.google.dev/api/generate-content; postman/contracts/gemini-generate-content.yaml
    updated_at: '2026-11-03'
  - id: controlled-caller-behavior
    status: supported
    claim: In the controlled HTTP run, seven kinds accepted empty structured proposals and each backend sanitized quota, unavailable, timeout, malformed and truncated results without observed retries.
    reason: The actual backend adapters ran in separate subprocesses against the Postman mock, and 22 expected requests appeared in its log.
    verification: On 2026-11-03 scripts/smoke_gemini.py completed 22 of 22 cases; simulation log contained exactly 22 requests (7 successful, 3 per failure scenario). Services and persistence are covered by separate backend tests.
    source: scripts/smoke_gemini.py; postman/mocks/gemini/default.js; docs/local-ai-testing.md
    updated_at: '2026-11-03'
  - id: real-google-availability
    status: unknown
    claim: The user's Google API project can call the configured Gemini model and produce useful authorized recommendations within its quota.
    reason: On 2026-11-03 no key or real request was available. Bounded synthetic calls succeeded for all seven kinds on 2026-11-14 after schema correction, with one initial roles 503 followed by a successful manual repeat. General quality, future availability and quota remain unverified.
    verification: Actual adapters returned HTTP 200 and validated all seven kinds at the official endpoint. Identity invented no actions; Projects returned empty proposals and allowed evidence with no eligible candidates; Backlog returned one synthetic story. No databases, runtime processes or production settings were changed.
    source: docs/local-ai-testing.md; https://ai.google.dev/gemini-api/docs/pricing
    updated_at: '2026-11-14'
  - id: observed-array-schema-compatibility
    status: supported
    claim: The tested access_anomalies schema returned 400 on gemini-3.5-flash-lite while omitting only array maxItems returned 200 and a locally valid response.
    reason: Real-request isolation retained types, required fields, enums, text limits and array minimums. This does not imply all maxItems uses are unsupported; the simulation does not emulate Google's schema grammar compiler.
    verification: On 2026-11-14 removing only maxItems resolved the original 400. All three corrected adapters then validated real responses. Regression tests still reject over-limit output and preserve Backlog's original schema.
    source: docs/local-ai-testing.md; backend docs/gemini.md; https://ai.google.dev/gemini-api/docs/structured-output#simplifying-complex-schemas
    updated_at: '2026-11-14'
  - id: controlled-caller-behavior-after-schema-fix
    status: supported
    claim: Corrected adapters accept seven controlled successful kinds and sanitize quota, unavailable, timeout, malformed and truncated responses without observed retries.
    reason: The existing local Postman simulation was rerun unchanged, separately from Google, with synthetic keys and no database access.
    verification: On 2026-11-14 scripts/smoke_gemini.py passed 22 cases; an isolated simulation log contained exactly 22 request events. The owned simulation was stopped afterwards; existing demo processes were preserved.
    source: scripts/smoke_gemini.py; postman/mocks/gemini/default.js; docs/local-ai-testing.md
    updated_at: '2026-11-14'
